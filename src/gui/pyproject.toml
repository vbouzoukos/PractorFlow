[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "practorflow-gui"
version = "0.1.0"
description = "PractorFlow GUI - Desktop chat client for PractorFlow API"
readme = "README.md"
license = { text = "Apache License 2.0" }
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Environment :: X11 Applications :: Qt",
]
keywords = ["llm", "ai", "chat", "gui", "desktop", "qt"]

dependencies = [
    "PySide6",
    "httpx",
    "httpx-sse",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-qt",
    "black",
    "isort",
    "mypy",
]

[project.urls]
Homepage = "https://github.com/vbouzoukos/PractorFlow"
Documentation = "https://github.com/vbouzoukos/PractorFlow#readme"
Repository = "https://github.com/vbouzoukos/PractorFlow"
Issues = "https://github.com/vbouzoukos/PractorFlow/issues"

[project.scripts]
practorflow-gui = "gui.main:main"

[project.gui-scripts]
practorflow-chat = "gui.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["gui*"]

[tool.setuptools.package-data]
gui = ["py.typed"]

[tool.black]
line-length = 88
target-version = ["py310", "py311", "py312"]

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true