[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "practorflow"
version = "0.1.0"
description = "PractorFlow - Private AI Service for local LLM inference with RAG support"
readme = "README.md"
license = { text = "Apache License 2.0" }
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = ["llm", "ai", "rag", "inference", "local", "private"]

dependencies = [
    "llama-cpp-python",
    "torch",
    "transformers",
    "accelerate",
    "protobuf",
    "docling",
    "chardet",
    "mistral-common",
    "sentence-transformers",
    "chromadb",
    "bitsandbytes",
    "ddgs",
    "serpapi",
    "pydantic-ai",
    "python-dotenv",
    "tinydb",
]

[project.optional-dependencies]
llama-cpp = [
    "llama-cpp-python",
]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "black",
    "isort",
    "mypy",
    # API testing
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "httpx",
    # GUI testing
    "pytest-qt",
    "PySide6",
    "httpx-sse",
]

[project.urls]
Homepage = "https://github.com/vbouzoukos/PractorFlow"
Documentation = "https://github.com/vbouzoukos/PractorFlow#readme"
Repository = "https://github.com/vbouzoukos/PractorFlow"
Issues = "https://github.com/vbouzoukos/PractorFlow/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["practorflow*"]

[tool.setuptools.package-data]
practorflow = ["py.typed"]

[tool.black]
line-length = 88
target-version = ["py310", "py311", "py312"]

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = [
    "-v",
    "--tb=short",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=xml",
    "--ignore=tests/practorflow/common",
]
